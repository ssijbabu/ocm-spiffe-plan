<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5bc7"/></marker></defs>
<rect width="1200" height="400" fill="#ffffff"/>
<text x="600.0" y="32" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Use case: renewal. SPIRE replaces the SVID, the connection is replaced</text>
<line x1="190" y1="290" x2="1150" y2="290" stroke="#333" stroke-width="1.5"/>
<line x1="190.0" y1="285" x2="190.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="190.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">10:00</text>
<line x1="286.0" y1="285" x2="286.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="286.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">10:10</text>
<line x1="382.0" y1="285" x2="382.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="382.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">10:20</text>
<line x1="478.0" y1="285" x2="478.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="478.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">10:30</text>
<line x1="574.0" y1="285" x2="574.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="574.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">10:40</text>
<line x1="670.0" y1="285" x2="670.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="670.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">10:50</text>
<line x1="766.0" y1="285" x2="766.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="766.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">11:00</text>
<line x1="862.0" y1="285" x2="862.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="862.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">11:10</text>
<line x1="958.0" y1="285" x2="958.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="958.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">11:20</text>
<line x1="1054.0" y1="285" x2="1054.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="1054.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">11:30</text>
<line x1="1150.0" y1="285" x2="1150.0" y2="295" stroke="#333" stroke-width="1.5"/>
<text x="1150.0" y="312" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">11:40</text>
<line x1="478.0" y1="60" x2="478.0" y2="290" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="766.0" y1="60" x2="766.0" y2="290" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="190.0" y="70" width="576.0" height="28" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="478.0" y="88" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">SVID A, valid 10:00 to 11:00</text>
<text x="20" y="88" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">SVID from SPIRE</text>
<rect x="478.0" y="106" width="576.0" height="28" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="766.0" y="124" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">SVID B, issued 10:30, valid to 11:30</text>
<rect x="190.0" y="162" width="576.0" height="28" rx="6" fill="#e3ebfb" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="478.0" y="180" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">connection 1, opened with SVID A</text>
<text x="20" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Agent to hub</text>
<rect x="775.6" y="198" width="374.4" height="28" rx="6" fill="#e3ebfb" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="962.8" y="216" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle">connection 2, opened with SVID B</text>
<text x="470.0" y="252" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">10:30 SPIRE rotates. The agent now holds B.</text>
<text x="470.0" y="268" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">OCM does nothing; connection 1 keeps running.</text>
<text x="774.0" y="252" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">11:00 A expires. The hub&#x27;s registry</text>
<text x="774.0" y="268" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">closes connection 1.</text>
<text x="600" y="352" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">The agent reconnects by itself after 5 to 10 seconds, shows SVID B, subscribes again and resyncs. Nothing is lost.</text>
<text x="600" y="376" font-size="11.5" font-weight="normal" fill="#555" text-anchor="middle">Times are an example with a 1 hour SVID. SPIRE decides when to rotate.</text>
</svg>
