<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5bc7"/></marker></defs>
<rect width="1200" height="420" fill="#ffffff"/>
<text x="600.0" y="32" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Use case: recovery when an admission policy was removed or changed</text>
<rect x="30" y="70" width="250" height="74" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.3"/>
<text x="155.0" y="96.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Every pass</text>
<text x="155.0" y="111.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">compare the live policies with</text>
<text x="155.0" y="126.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">the record in the Klusterlet status</text>
<rect x="340" y="70" width="230" height="74" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.3"/>
<text x="455.0" y="103.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Same UID and generation?</text>
<text x="455.0" y="118.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">or changed by the operator itself</text>
<rect x="640" y="70" width="260" height="74" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="770.0" y="96.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Trusted</text>
<text x="770.0" y="111.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">agents run;</text>
<text x="770.0" y="126.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SPIFFEAdmissionReady = True</text>
<rect x="950" y="70" width="220" height="74" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="1060.0" y="96.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Operator&#x27;s own change</text>
<text x="1060.0" y="111.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">for example an upgrade:</text>
<text x="1060.0" y="126.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">record it, no recovery</text>
<path d="M280,107 L340,107" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<path d="M570,107 L640,107" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="605" y="100" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">yes</text>
<path d="M950,107 L900,107" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="30" y="230" width="212" height="96" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="136.0" y="267.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Restore</text>
<text x="136.0" y="282.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">apply the policies</text>
<text x="136.0" y="297.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">and bindings again</text>
<path d="M242,278 L262,278" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="262" y="230" width="212" height="96" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="368.0" y="259.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Unlabel</text>
<text x="368.0" y="274.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">remove the add-on label</text>
<text x="368.0" y="289.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">from namespaces that</text>
<text x="368.0" y="304.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">are not on record</text>
<path d="M474,278 L494,278" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="494" y="230" width="212" height="96" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="600.0" y="259.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Delete workloads</text>
<text x="600.0" y="274.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">in the agent namespace</text>
<text x="600.0" y="289.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">and the recorded</text>
<text x="600.0" y="304.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">add-on namespaces</text>
<path d="M706,278 L726,278" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="726" y="230" width="212" height="96" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="832.0" y="259.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Wait</text>
<text x="832.0" y="274.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">until no pod is left</text>
<text x="832.0" y="289.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">(come back later,</text>
<text x="832.0" y="304.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">do not block)</text>
<path d="M938,278 L958,278" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="958" y="230" width="212" height="96" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="1064.0" y="259.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5. Record</text>
<text x="1064.0" y="274.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">write UIDs and generations</text>
<text x="1064.0" y="289.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">to the status, end the pass;</text>
<text x="1064.0" y="304.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">agents start on the next</text>
<path d="M455,144 L455,188 L136,188 L136,230" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="300" y="182" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">no: deleted, replaced or edited by someone else</text>
<path d="M1064,230 L1064,188 L770,188 L770,144" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="917" y="182" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">next pass</text>
<text x="600" y="366" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">While the policy was missing, someone could have started a pod that poses as an agent. The operator cannot tell which pods</text>
<text x="600" y="384" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">are good, so it removes all of them and starts its own again. It never deletes anything outside these namespaces.</text>
</svg>
