<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 758" width="1200" height="758" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5bc7"/></marker></defs>
<rect width="1200" height="758" fill="#ffffff"/>
<text x="600.0" y="32" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Components: who talks to whom</text>
<g transform="translate(0,90)">
<rect x="20" y="60" width="560" height="560" rx="10" fill="#f5f2fa" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="36" y="84" font-size="14" font-weight="bold" fill="#6a4c9c" text-anchor="start">Hub cluster</text>
<rect x="640" y="60" width="540" height="560" rx="10" fill="#f3f6fc" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="656" y="84" font-size="14" font-weight="bold" fill="#3a5bc7" text-anchor="start">Managed cluster (management cluster in hosted modes)</text>
<rect x="40" y="100" width="250" height="64" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.3"/>
<text x="165.0" y="121.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">cluster-manager operator</text>
<text x="165.0" y="136.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">reads ClusterManager,</text>
<text x="165.0" y="151.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">deploys the gRPC server</text>
<rect x="400" y="196" width="160" height="60" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="480.0" y="222.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPIRE agent</text>
<text x="480.0" y="237.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">+ SPIFFE CSI driver</text>
<rect x="40" y="200" width="330" height="240" rx="6" fill="#ffffff" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="205" y="222" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">hub gRPC server</text>
<rect x="56" y="234" width="298" height="50" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.3"/>
<text x="205.0" y="255.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">grpc listener :8090</text>
<text x="205.0" y="270.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">existing driver, unchanged</text>
<rect x="56" y="296" width="298" height="130" rx="6" fill="#ebe4f7" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="205.0" y="335.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPIFFE listener :8091</text>
<text x="205.0" y="350.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SPIFFE mTLS only, SVID from the Workload API</text>
<text x="205.0" y="365.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">registry closes connections at SVID expiry</text>
<text x="205.0" y="380.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SPIFFE ID is mapped to an OCM user</text>
<text x="205.0" y="395.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">cluster gate, SVID check, Kubernetes RBAC</text>
<rect x="40" y="476" width="250" height="84" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.3"/>
<text x="165.0" y="507.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">registration controllers</text>
<text x="165.0" y="522.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">accept, permissions,</text>
<text x="165.0" y="537.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">delete guard</text>
<rect x="330" y="476" width="230" height="84" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.3"/>
<text x="445.0" y="507.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">hub kube-apiserver</text>
<text x="445.0" y="522.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">ManagedCluster, ManifestWork,</text>
<text x="445.0" y="537.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">ManagedClusterAddOn</text>
<path d="M165,164 L165,200" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="196" y="186" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">deploys</text>
<path d="M400,226 L372,226" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="385" y="190" font-size="10.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">server</text>
<path d="M350,440 L350,476" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<path d="M290,518 L330,518" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="660" y="100" width="250" height="64" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.3"/>
<text x="785.0" y="121.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">klusterlet operator</text>
<text x="785.0" y="136.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">reads Klusterlet, deploys agents,</text>
<text x="785.0" y="151.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">installs admission policies</text>
<rect x="660" y="210" width="230" height="56" rx="6" fill="#e3ebfb" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="775.0" y="234.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">registration agent</text>
<text x="775.0" y="249.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SVID role: registration</text>
<rect x="660" y="290" width="230" height="56" rx="6" fill="#e3ebfb" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="775.0" y="314.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">work agent</text>
<text x="775.0" y="329.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SVID role: work</text>
<rect x="660" y="370" width="230" height="56" rx="6" fill="#e3ebfb" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="775.0" y="394.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">add-on agent</text>
<text x="775.0" y="409.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SVID role: addon</text>
<rect x="980" y="270" width="180" height="96" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="1070.0" y="299.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPIRE agent</text>
<text x="1070.0" y="314.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">+ SPIFFE CSI driver</text>
<text x="1070.0" y="329.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">Workload API socket</text>
<text x="1070.0" y="344.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">SVIDs stay in memory</text>
<rect x="660" y="476" width="500" height="84" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="910.0" y="507.0" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">admission policies (ValidatingAdmissionPolicy)</text>
<text x="910.0" y="522.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">only pods the operator created can get an agent&#x27;s SVID;</text>
<text x="910.0" y="537.0" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">no exec, no image change; add-on namespaces are dedicated</text>
<path d="M785,164 L785,210" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="816" y="192" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">deploys</text>
<path d="M980,296 L890,238" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M980,318 L890,318" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M980,340 L890,398" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="940" y="250" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">SVID</text>
<path d="M660,238 L354,330" fill="none" stroke="#3a5bc7" stroke-width="1.5" marker-end="url(#ab)"/>
<path d="M660,318 L354,361" fill="none" stroke="#3a5bc7" stroke-width="1.5" marker-end="url(#ab)"/>
<path d="M660,398 L354,392" fill="none" stroke="#3a5bc7" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="507" y="300" font-size="11.5" font-weight="normal" fill="#3a5bc7" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">gRPC over mTLS:</text>
<text x="507" y="315" font-size="11.5" font-weight="normal" fill="#3a5bc7" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">both sides show an SVID</text>
<text x="385" y="204" font-size="10.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">SVID</text>
</g>
<rect x="500" y="50" width="200" height="60" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="600.0" y="75.5" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPIRE server</text>
<text x="600.0" y="90.5" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">outside both clusters; issues SVIDs</text>
<path d="M530,110 L530,286" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M700,80 L1070,80 L1070,360" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="600" y="736" font-size="12" font-weight="normal" fill="#444" text-anchor="middle">Green = SPIRE, installed and run by the platform team. OCM talks only to the local SPIRE agent (Workload API) and never stores an SVID.</text>
</svg>
