<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 888" width="1200" height="888" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5bc7"/></marker></defs>
<rect width="1200" height="888" fill="#ffffff"/>
<text x="600" y="32" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Use case: a hub user sends work to a cluster</text>
<line x1="100" y1="96" x2="100" y2="800" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="10" y="56" width="180" height="40" rx="6" fill="#fff4e5" stroke="#b26a00" stroke-width="1.3"/>
<text x="100" y="80" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hub user</text>
<line x1="300" y1="96" x2="300" y2="800" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="210" y="56" width="180" height="40" rx="6" fill="#f5f2fa" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="300" y="80" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hub kube-apiserver</text>
<line x1="500" y1="96" x2="500" y2="800" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="410" y="56" width="180" height="40" rx="6" fill="#f5f2fa" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="500" y="80" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hub SPIFFE listener</text>
<line x1="700" y1="96" x2="700" y2="800" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="610" y="56" width="180" height="40" rx="6" fill="#f3f6fc" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="700" y="80" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Work agent</text>
<line x1="900" y1="96" x2="900" y2="800" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="810" y="56" width="180" height="40" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="900" y="80" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPIRE agent</text>
<line x1="1100" y1="96" x2="1100" y2="800" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="1010" y="56" width="180" height="40" rx="6" fill="#f3f6fc" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="1100" y="80" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Managed cluster API</text>
<rect x="10" y="112" width="1180" height="22" rx="4" fill="#f0f0f0"/>
<text x="20" y="127.5" font-size="12" font-weight="bold" fill="#444" text-anchor="start">1. The work agent connects, with its own SVID</text>
<path d="M700,160 L898,160" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="800.0" y="140" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Workload API: SVID with ID</text>
<text x="800.0" y="154" font-size="11.5" font-weight="normal" fill="#2e7d32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">…/cluster/cluster1/agent/work</text>
<rect x="605.0" y="172" width="190" height="57" rx="6" fill="#e3ebfb" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="700" y="192" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SVID kept in memory</text>
<text x="700" y="207" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">health check spiffe-svid is</text>
<text x="700" y="222" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">not ready until it arrives</text>
<path d="M700,262 L502,262" fill="none" stroke="#3a5bc7" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="600.0" y="242" font-size="11.5" font-weight="normal" fill="#3a5bc7" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">mTLS with the work SVID;</text>
<text x="600.0" y="256" font-size="11.5" font-weight="normal" fill="#3a5bc7" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">watch ManifestWorks of cluster1</text>
<rect x="405.0" y="274" width="190" height="42" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="500" y="294" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">checks 1-7 (4.2)</text>
<text x="500" y="309" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">gate, own cluster, RBAC</text>
<rect x="10" y="340" width="1180" height="22" rx="4" fill="#f0f0f0"/>
<text x="20" y="355.5" font-size="12" font-weight="bold" fill="#444" text-anchor="start">2. A hub user creates a ManifestWork</text>
<path d="M100,400 L298,400" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="200.0" y="380" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">ManifestWork in</text>
<text x="200.0" y="394" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">namespace cluster1</text>
<path d="M300,436 L498,436" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="400.0" y="430" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">informer: new ManifestWork</text>
<path d="M500,472 L698,472" fill="none" stroke="#3a5bc7" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="600.0" y="466" font-size="11.5" font-weight="normal" fill="#3a5bc7" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">event: ManifestWork created</text>
<path d="M700,508 L1098,508" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="900.0" y="502" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">apply the manifests (e.g. ConfigMap e2e-cm)</text>
<rect x="10" y="536" width="1180" height="22" rx="4" fill="#f0f0f0"/>
<text x="20" y="551.5" font-size="12" font-weight="bold" fill="#444" text-anchor="start">3. The work agent sends the status back</text>
<path d="M700,586 L502,586" fill="none" stroke="#3a5bc7" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="600.0" y="580" font-size="11.5" font-weight="normal" fill="#3a5bc7" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">status update: Applied, Available</text>
<rect x="405.0" y="598" width="190" height="27" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.3"/>
<text x="500" y="618" font-size="11" font-weight="normal" fill="#1a1a1a" text-anchor="middle">checked again: checks 1-7</text>
<path d="M500,654 L302,654" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="400.0" y="648" font-size="11.5" font-weight="normal" fill="#222" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">write ManifestWork status</text>
<rect x="10" y="682" width="1180" height="22" rx="4" fill="#f0f0f0"/>
<text x="20" y="697.5" font-size="12" font-weight="bold" fill="#444" text-anchor="start">Refused: the agent asks about another cluster</text>
<path d="M700,730 L502,730" fill="none" stroke="#c62828" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="600.0" y="724" font-size="11.5" font-weight="normal" fill="#c62828" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">watch ManifestWorks of cluster2</text>
<rect x="385.0" y="742" width="230" height="57" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.3"/>
<text x="500" y="762" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">refused at check 5 (SVID check)</text>
<text x="500" y="777" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">&quot;...:cluster1:work may not act</text>
<text x="500" y="792" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">on cluster &quot;cluster2&quot;&quot;</text>
<rect x="20" y="816" width="1160" height="56" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
<text x="36" y="842" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Singleton:</text>
<text x="115" y="842" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">one process does registration and work. It has one SVID, role klusterlet (…/agent/klusterlet), and maps to user</text>
<text x="115" y="860" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">system:open-cluster-management:cluster1:klusterlet. The flow is the same. Hosted modes: the agent runs on the management cluster and applies to the managed one.</text>
</svg>