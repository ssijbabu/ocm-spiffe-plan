<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5bc7"/></marker></defs>
<rect width="1200" height="300" fill="#ffffff"/>
<text x="600.0" y="32" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Where the code is: five repositories, branch spire</text>
<rect x="20" y="80" width="216" height="110" rx="6" fill="#f5f2fa" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="128.0" y="116.5" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">api</text>
<text x="128.0" y="131.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">settings (CRDs), feature gate,</text>
<text x="128.0" y="146.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">constants</text>
<text x="128.0" y="161.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">Days 2 to 3</text>
<path d="M236,135 L256,135" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="256" y="80" width="216" height="110" rx="6" fill="#f5f2fa" stroke="#6a4c9c" stroke-width="1.3"/>
<text x="364.0" y="116.5" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">sdk-go</text>
<text x="364.0" y="131.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">ID templates, identity mapping,</text>
<text x="364.0" y="146.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">TLS, registry, SVID checks, fake SPIRE</text>
<text x="364.0" y="161.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">Days 4 to 9, 11</text>
<path d="M472,135 L492,135" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="492" y="80" width="216" height="110" rx="6" fill="#f3f6fc" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="600.0" y="116.5" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">addon-framework</text>
<text x="600.0" y="131.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">add-on manifests, subject check,</text>
<text x="600.0" y="146.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">spiffeclient helper</text>
<text x="600.0" y="161.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">Day 23</text>
<path d="M708,135 L728,135" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="728" y="80" width="216" height="110" rx="6" fill="#f3f6fc" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="836.0" y="116.5" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ocm</text>
<text x="836.0" y="131.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">listener, gate, delete guard,</text>
<text x="836.0" y="146.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">operators, agents, policies, e2e</text>
<text x="836.0" y="161.5" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">Days 10 to 22, 25 to 28</text>
<path d="M944,135 L964,135" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ak)"/>
<rect x="964" y="80" width="216" height="110" rx="6" fill="#f3f6fc" stroke="#3a5bc7" stroke-width="1.3"/>
<text x="1072.0" y="124.0" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">clusteradm</text>
<text x="1072.0" y="139.0" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">init, join, accept</text>
<text x="1072.0" y="154.0" font-size="10.5" font-weight="normal" fill="#333" text-anchor="middle">Day 24</text>
<text x="600" y="228" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle">An arrow means &quot;is used by&quot;. Each repository also uses everything to its left.</text>
<text x="600" y="252" font-size="11.5" font-weight="normal" fill="#555" text-anchor="middle">Until the changes are merged upstream, the repositories point at each other with temporary replace lines in go.mod.</text>
</svg>
